server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Drop unknown Host headers before they reach the application.
    return 444;
}

server {
    listen 80;
    server_name grp.prismappolice.in www.grp.prismappolice.in 13.233.250.180;
    server_tokens off;

    # Redirect only recognized plain-HTTP hosts to the canonical HTTPS site.
    return 301 https://grp.prismappolice.in$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/grp.prismappolice.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grp.prismappolice.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 444;
}

server {
    listen 443 ssl;
    server_name grp.prismappolice.in www.grp.prismappolice.in;
    server_tokens off;

    if ($host !~* ^(grp\.prismappolice\.in|www\.grp\.prismappolice\.in)$) {
        return 444;
    }

    # SSL — managed by certbot (paths auto-set; leave these as-is)
    ssl_certificate     /etc/letsencrypt/live/grp.prismappolice.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grp.prismappolice.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /var/www/grp;
    index index.html;

    # ── Backend API ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              grp.prismappolice.in;
        proxy_set_header   X-Forwarded-Host  grp.prismappolice.in;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  X-AspNet-Version;
        proxy_hide_header  X-AspNetMvc-Version;
        proxy_hide_header  X-Generator;
        proxy_hide_header  X-Runtime;
        client_max_body_size 50M;
    }

    # ── Backend-served static upload paths ────────────────────
    # Proxied directly to FastAPI which mounts these as StaticFiles.
    location ~* ^/(unidentified_uploads|gallery_uploads|news_uploads|complaint_uploads)/.*\.(html?|php|phtml|phar|jsp|asp|aspx|js|svg|exe|sh|bat|cmd)$ {
        return 403;
    }

    location ~* ^/(unidentified_uploads|gallery_uploads|news_uploads|complaint_uploads)/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              grp.prismappolice.in;
        proxy_set_header   X-Forwarded-Host  grp.prismappolice.in;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
        proxy_hide_header  X-AspNet-Version;
        proxy_hide_header  X-AspNetMvc-Version;
        proxy_hide_header  X-Generator;
        proxy_hide_header  X-Runtime;
    }

    # ── Frontend (React SPA) ───────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
