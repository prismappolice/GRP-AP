server {
    listen 80;
    server_name grp.prismappolice.in www.grp.prismappolice.in;
    server_tokens off;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name grp.prismappolice.in www.grp.prismappolice.in;
    server_tokens off;

    # SSL — managed by certbot (paths auto-set; leave these as-is)
    ssl_certificate     /etc/letsencrypt/live/grp.prismappolice.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grp.prismappolice.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/grp;
    index index.html;

    # ── Backend API ────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
        client_max_body_size 50M;
    }

    # ── Backend-served static upload paths ────────────────────
    # Proxied directly to FastAPI which mounts these as StaticFiles.
    location ~* ^/(unidentified_uploads|gallery_uploads|news_uploads|complaint_uploads)/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_hide_header  Server;
        proxy_hide_header  X-Powered-By;
    }

    # ── Frontend (React SPA) ───────────────────────────────────
    location / {
        try_files $uri /index.html;
    }
}
